name: Déployer la fonction cours

# Le tableau de bord Supabase ne propose pas toujours d'éditeur pour les Edge
# Functions. Ce workflow les déploie à ta place, sans rien installer sur ton
# poste : il suffit d'un jeton d'accès rangé dans les secrets du dépôt.
#
# À faire une fois :
#   1. https://supabase.com/dashboard/account/tokens → Generate new token
#   2. Settings → Secrets and variables → Actions → New repository secret
#      nom : SUPABASE_ACCESS_TOKEN
#   3. Onglet Actions → « Déployer la fonction cours » → Run workflow
#
# À relancer seulement si le contenu de la fonction change.

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/**"

permissions:
  contents: read

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN est absent. Voir l'en-tête de ce fichier."
            exit 1
          fi
          supabase functions deploy cours --project-ref pyduueytagmzsdwtzltu
